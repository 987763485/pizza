            proposal: 采用独立实现的 Electron + React + TypeScript + electron-vite 桌面架构；主进程负责
              SQLite（WAL/FTS5）、运行时子进程、文件监听与系统能力，preload 暴露窄 IPC，渲染层使用 React
              Router、Zustand 和 CSS Modules。运行时使用统一 RuntimeAdapter，首批实现 ACP stdio
              与 Claude Code CLI，其他预设标记实验性。事件先落库再推送，产出物通过运行期工作区监听与工具事件识别。安全边界包括
              contextIsolation、CSP、argv 启动、Zod 校验和 safeStorage。测试采用
              Vitest、假运行时集成测试、Playwright Electron 冒烟和一次真实运行时手工验收。无 Spec
              Patch；PDF、额外运行时认证和安装包留给后续变更。
