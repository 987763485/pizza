            handoffHash: c4b73062192ffb481d47226fd3d59a9fae2f74bc7bcb8eaba5857e27af7a1e27
            proposal: 采用共享 AgentRunExecutor：从单智能体 RunService 抽出运行时执行核心，RunService 保留 solo
              FIFO 队列，新增 TeamOrchestrator 负责团队队列、并发、回合状态与保护；不另起运行时进程。SQLite 新增
              team、team_member、message_mention、team_turn、team_turn_event，并在 run
              增加 team_turn_id。提及解析为共享纯函数：智能体只认 [@名称](mention://agent/<id>)，用户支持
              chip 序列化；按会话名→团队名→全局唯一名解析，重名歧义/未知/自引用均写系统事件。团队默认最大并发
              3、成员互斥；并行/串行策略；用户插话统一排队（现有运行时无追加能力），支持单个/全部停止。保护：跳数 12、轮次默认 5、单运行
              30 分钟、2 分钟重复抑制、A→B→A 告警、token 预算可选（建议默认不限，80%/100%
              提醒与停止），触发后强制指挥者结构化总结。上下文采用确定性结构化压缩，不额外调用模型。收敛总结写入
              .pizza/artifacts/
              并索引到产出物。UI：团队列表与整页编辑、头脑风暴模板在选定运行时上自动补齐五名角色、首页团队分组、团队会话头部/回合分隔/等待用户/多参与者消息/轨迹页签/contentEditable
              提及 chip。无 Spec Patch。风险：执行器抽取回归（以现有 22 测试和 E2E
              守护）、并发竞态（会话串行状态机+事务）、无限互 @（多层保护）、上下文膨胀（结构化压缩）、运行时插话能力差异（排队降级）。
            requirementsEvidence:
              contentHash: ed6929fd3e0b39fa3320ef7b7e17339d413caa821ca329a8b8b87a15963b6cd4
