            proposal: 采用 CapabilityResolver + InjectionPipeline：每次运行按智能体→团队成员覆盖→全局默认解析
              Skill/MCP，失败只影响对应能力并写诊断。Skill 存 ~/.pizza/skills，运行级物化；Claude 用
              --plugin-dir 加载 plugin，ACP 注入清单/路径。MCP 用官方 TypeScript SDK 支持
              stdio/SSE/HTTP，凭据 safeStorage 加密，Claude 用 --mcp-config，ACP 以 stdio
              mcpServers 注入，远程 MCP 在 ACP 不支持时标记不可用。统一 ApprovalService：ACP
              permission request + Claude PreToolUse hook（临时 --settings + 本地
              socket）进入同一审批对话框，允许一次/总是允许/拒绝，120 秒超时拒绝，FIFO
              队列，危险操作默认询问。设置中心扩展默认值、数据目录迁移（复制→校验→切换→保留旧目录）、通知偏好；通知用 Electron
              Notification/托盘并支持点击定位与免打扰。i18next
              中英文即时切换，主题/字号/密度/减少动效根属性，启动前读取避免闪烁。首次启动用
              which/预设命令探测六种运行时，引导创建运行时/智能体/会话；electron-builder 生成未签名 macOS
              zip/dmg，构建校验版本与许可。新增迁移
              v5：skill、skill_binding、mcp_server、mcp_binding、approval、notification。风险：CLI
              hook 版本差异（安全拒绝）、凭据泄漏（掩码/加密/导出白名单）、审批阻塞（超时拒绝）、i18n
              遗漏（键扫描）、打包签名限制（未签名验收）。
